name: Release SlimeBoss Beta

# Standalone SlimeBossBeta mod (SlimeBoss.csproj, ModId SlimeBossBeta) as its OWN Workshop item,
# separate from the core Downfall release. Lives on the `Slimeboss` branch; main keeps SlimeBoss
# bundled in the Downfall release and never runs this. Triggered by `slimeboss-vX.Y.Z` tags so it
# can't collide with the core `v*` tags. No GitHub release is created: the build output is handed
# to the upload job as a workflow artifact. Downfall is a Workshop "required item", not bundled.

on:
  push:
    tags: ['slimeboss-v*']

env:
  MEGADOT_VERSION: 4.5.1-m.14
  SPINE_VERSION: 4.2-4.5.1-stable

jobs:
  build:
    runs-on: ubuntu-latest
    # SlimeBoss's own environment (limited to slimeboss-v* tags), so Downfall's `release`/`steam`
    # rules stay untouched. It holds STEAM_USERNAME / STEAM_CONFIG_VDF / STEAM_WORKSHOP_ID_SLIMEBOSS;
    # this job never references them, so its steps don't see the Steam secrets.
    environment: slimeboss
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale build artifacts
        run: rm -rf .godot obj bin

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#slimeboss-v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be slimeboss-vX.Y.Z, got $GITHUB_REF_NAME"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache engine downloads
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: |
            megadot.zip
            spine-godot.zip
          key: engine-${{ env.MEGADOT_VERSION }}-${{ env.SPINE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: nuget-

      - name: Download MegaDot
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: curl -L -o megadot.zip "https://megadot.megacrit.com/${MEGADOT_VERSION}/megadot-${MEGADOT_VERSION}-linux-x86_64-editor-csharp.zip"

      - name: Download spine-godot extension
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o spine-godot.zip \
            "https://spine-godot.s3.eu-central-1.amazonaws.com/4.2/4.5.1-stable/spine-godot-extension-${SPINE_VERSION}.zip"

      - name: Install engine
        run: |
          unzip -q megadot.zip -d megadot
          chmod +x megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64
          echo "GODOT_PATH=$(pwd)/megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          unzip -oq spine-godot.zip -d "${{ github.workspace }}"

      - name: Sync manifest version
        run: |
          sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[0-9]+\.[0-9]+\.[0-9]+(")/\1'"$VERSION"'\2/' SlimeBoss.json
          grep '"version"' SlimeBoss.json

      - name: Build image atlases
        run: dotnet run --project ImageGen -c Release

      - name: Import Godot resources
        run: |
          "$GODOT_PATH" --headless --audio-driver Dummy --import || true
          "$GODOT_PATH" --headless --audio-driver Dummy --import

      # Publishing SlimeBoss.csproj also builds its Downfall.csproj reference, but only the
      # SlimeBossBeta output folder is packaged: Downfall itself stays a separate Workshop item.
      - name: Publish SlimeBossBeta
        run: |
          mkdir -p "${{ github.workspace }}/output/mods"
          dotnet publish SlimeBoss.csproj -c Release \
            /p:GodotPath="$GODOT_PATH" \
            /p:ModsPath="${{ github.workspace }}/output/mods/" \
            /p:SkipGodotImport=true \
            /p:Version="$VERSION" \
            /p:AssemblyVersion="$VERSION.0" \
            /p:FileVersion="$VERSION.0"

      - name: Verify mod folder
        run: |
          test -d output/mods/SlimeBossBeta || { echo "SlimeBossBeta folder missing"; exit 1; }
          for f in SlimeBossBeta.dll SlimeBossBeta.pck SlimeBossBeta.json; do
            test -f "output/mods/SlimeBossBeta/$f" || { echo "$f missing"; exit 1; }
          done
          find output/mods/SlimeBossBeta -name '*.pdb' -delete
          ls -la output/mods/SlimeBossBeta

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimeBossBeta
          path: output/mods/SlimeBossBeta
          if-no-files-found: error
          retention-days: 7

  steam:
    needs: build
    runs-on: ubuntu-latest
    # Same `slimeboss` environment as the build job; add a required reviewer there to gate uploads.
    environment: slimeboss
    permissions:
      contents: read
    steps:
      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#slimeboss-v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be slimeboss-vX.Y.Z, got $GITHUB_REF_NAME"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download build artifact
        if: vars.STEAM_WORKSHOP_ID_SLIMEBOSS != ''
        uses: actions/download-artifact@v4
        with:
          name: SlimeBossBeta
          path: steam-input/SlimeBossBeta

      # Skipped (not failed) until the Workshop item exists and its id is stored in the variable
      # STEAM_WORKSHOP_ID_SLIMEBOSS - the item must be created once by hand first.
      - name: Upload to Steam Workshop
        if: vars.STEAM_WORKSHOP_ID_SLIMEBOSS != ''
        uses: m00nl1ght-dev/steam-workshop-deploy@v4
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 2868840
          publishedFileId: ${{ vars.STEAM_WORKSHOP_ID_SLIMEBOSS }}
          path: steam-input/SlimeBossBeta
          changeNote: "SlimeBoss Beta v${{ env.VERSION }} (${{ github.sha }})"
