name: Publish
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
# A newer push to the same branch/PR cancels the still-running older build.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
env:
  MEGADOT_VERSION: 4.5.1-m.14
  SPINE_VERSION: 4.2-4.5.1-stable
jobs:
  publish:
    if: "!startsWith(github.event.head_commit.message, 'Release v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard against stale build artifacts (nothing generated should be in git).
      - name: Clean stale build artifacts
        run: rm -rf .godot obj bin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ---- Packed mod output cache: skip repacking entirely when only C# changed ----
      # Whitelist, not a blacklist: hash the full content of every directory that can feed the
      # .pck — ImageGen/ (atlas tool + its source images) and each character's asset folder
      # (Downfall/, Automaton/, Awakened/, ... — i.e. PackFolders' $(Submods) list, deliberately
      # NOT the matching *Code/ folder, which is pure C#) — rather than picking out subpatterns
      # like */images/** that silently miss anything not under images/localization/scenes/audio
      # (e.g. Downfall/scripts/, mod_image.png, per-character non-standard files). No
      # restore-keys: an exact match is required, since a stale pck for different assets would
      # be silently wrong. A hit means every one of those directories is byte-identical to some
      # prior successful run, so that run's .pck is still correct: the atlas build and Godot
      # import steps below can be skipped, and `dotnet build` (see CLAUDE.md's build-vs-publish
      # guidance) is enough to refresh the DLL without touching the restored .pck (GodotPublish
      # only runs after `dotnet publish`, never after `build`).
      # Declared first so its cache-hit is known before the engine/atlas/Godot-import caches
      # below even attempt to restore — none of those are needed on a code-only push.
      - name: Cache packed mod output
        id: cache-pck
        uses: actions/cache@v4
        with:
          path: output/mods
          key: pck-${{ env.MEGADOT_VERSION }}-default-${{ hashFiles('ImageGen/**', 'Downfall/**', 'Automaton/**', 'Awakened/**', 'Champ/**', 'Guardian/**', 'Hermit/**', 'Hexaghost/**', 'SlimeBoss/**', 'Snecko/**') }}

      # ---- Caches: skip re-downloading / re-restoring / re-importing when nothing changed ----
      # Skipped entirely on a pck cache hit — the engine is only needed to run the atlas/import
      # steps below, which themselves are skipped in that case.
      - name: Cache engine downloads
        id: cache-engine
        if: steps.cache-pck.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            megadot.zip
            spine-godot.zip
          key: engine-${{ env.MEGADOT_VERSION }}-${{ env.SPINE_VERSION }}

      # Always restored, even on a pck cache hit: the code-only `dotnet build` path below
      # still needs restored NuGet packages.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: nuget-

      # ---- ImageGen atlas cache ----
      # Persist ImageGen's own hash-based incremental cache (CI-safe) plus the generated
      # atlas outputs it diffs against. restore-keys means a single changed image reuses the
      # newest prior cache and only that image is repacked (no --repack, which would wipe it).
      # Skipped entirely on a pck cache hit — see "Cache packed mod output" above.
      - name: Cache image atlas outputs
        if: steps.cache-pck.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ImageGen/.cards_cache.json
            ImageGen/.powers_cache.json
            ImageGen/.relics_cache.json
            ImageGen/.potions_cache.json
            ImageGen/.enchantments_cache.json
            */images/atlases
            */images/powers
            */images/relics
            */images/enchantments
          key: atlases-${{ hashFiles('ImageGen/images/**/*.png') }}
          restore-keys: atlases-

      # Skipped entirely on a pck cache hit — see "Cache packed mod output" above.
      - name: Cache Godot import results
        if: steps.cache-pck.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ env.MEGADOT_VERSION }}-${{ hashFiles('**/*.png', '**/*.svg', '**/*.wav', '**/*.ogg', '**/*.spine-json', '**/*.skel', '**/*.import') }}
          restore-keys: godot-import-${{ env.MEGADOT_VERSION }}-

      # cache-engine is itself skipped on a pck cache hit (see above), leaving its
      # cache-hit output empty/falsy — so these must also check cache-pck directly,
      # or a pck hit would fall through into re-downloading the engine for nothing.
      - name: Download MegaDot
        if: steps.cache-pck.outputs.cache-hit != 'true' && steps.cache-engine.outputs.cache-hit != 'true'
        run: curl -L -o megadot.zip "https://megadot.megacrit.com/${MEGADOT_VERSION}/megadot-${MEGADOT_VERSION}-linux-x86_64-editor-csharp.zip"

      - name: Download spine-godot extension
        if: steps.cache-pck.outputs.cache-hit != 'true' && steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o spine-godot.zip \
            "https://spine-godot.s3.eu-central-1.amazonaws.com/4.2/4.5.1-stable/spine-godot-extension-${SPINE_VERSION}.zip"

      - name: Install engine
        if: steps.cache-pck.outputs.cache-hit != 'true'
        run: |
          unzip -q megadot.zip -d megadot
          chmod +x megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64
          echo "GODOT_PATH=$(pwd)/megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          unzip -oq spine-godot.zip -d "${{ github.workspace }}"

      # Generate the texture atlases BEFORE Godot imports them.
      # No --repack: that flag forces a full rebuild by wiping the cache
      # (`if (Force) groupCache = new JsonObject()`), defeating the cache above.
      # Skipped entirely on a code-only push — see "Cache packed mod output" above.
      - name: Build image atlases
        if: steps.cache-pck.outputs.cache-hit != 'true'
        run: dotnet run --project ImageGen -c Release

      # First cold import often exits non-zero while bootstrapping .godot/ — run twice.
      # With a warm import cache this step only re-imports changed assets.
      # Skipped entirely on a code-only push — see "Cache packed mod output" above.
      - name: Import Godot resources
        if: steps.cache-pck.outputs.cache-hit != 'true'
        run: |
          "$GODOT_PATH" --headless --audio-driver Dummy --import || true
          "$GODOT_PATH" --headless --audio-driver Dummy --import

      # Assets/localization changed (or the pck cache was empty/evicted): run the full
      # pipeline, which also repacks the .pck.
      - name: Publish
        if: steps.cache-pck.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/output/mods"
          dotnet publish Downfall.csproj -c Release \
            /p:GodotPath="$GODOT_PATH" \
            /p:ModsPath="${{ github.workspace }}/output/mods/" \
            /p:SkipGodotImport=true

      # Code-only push: the restored .pck from the cache hit above is still correct, so a
      # plain build (no Godot involved) is enough to refresh the DLL in place next to it.
      - name: Build (code-only, reusing cached .pck)
        if: steps.cache-pck.outputs.cache-hit == 'true'
        run: |
          mkdir -p "${{ github.workspace }}/output/mods"
          dotnet build Downfall.csproj -c Release \
            /p:ModsPath="${{ github.workspace }}/output/mods/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Downfall
          path: output/mods/Downfall
          retention-days: 14

  # Fast plain-.NET unit tests (UnitTests/): pure logic only, no game or engine needed. Separate
  # from the self-hosted in-game test job; runs in parallel with the publish job.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Unit tests
        run: dotnet test UnitTests/Downfall.UnitTests.csproj -c Release
