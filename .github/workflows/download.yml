name: Paratranz to GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  download:
    name: Download Translations (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything that lives on develop (develop has no Collector, so it is skipped there).
          - ref: develop
            only_mods: ""
          # Collector's own branch only gets Collector's strings.
          - ref: collector
            only_mods: Collector
          # SlimeBoss beta: the branch's own paratranz-branch.json maps SlimeBoss to the
          # SlimeBossBeta folder, so the live SlimeBoss translations are never touched.
          - ref: Slimeboss
            only_mods: ""
    environment: PARATRANZ_ENV
    runs-on: ubuntu-latest
    env:
      PARATRANZ_API_KEY: ${{ secrets.PARATRANZ_API_KEY }}
      PARA_ONLY_MODS: ${{ matrix.only_mods }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3"

      - name: Install dependencies
        run: pip install requests

      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Download translations from Paratranz
        run: python .github/scripts/para_download.py

      - name: Commit and Push changes
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes detected."
            exit 0
          fi
          git add .
          git commit -m "Sync translations from Paratranz"
          git push
