name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, no leading v)'
        required: true
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  MEGADOT_VERSION: 4.5.1-m.11
  SPINE_VERSION: 4.2-4.5.1-stable
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale build artifacts
        run: rm -rf .godot obj bin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache engine downloads
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: |
            megadot.zip
            spine-godot.zip
          key: engine-${{ env.MEGADOT_VERSION }}-${{ env.SPINE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: nuget-

      - name: Cache Godot import results
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ env.MEGADOT_VERSION }}-${{ hashFiles('**/*.png', '**/*.svg', '**/*.wav', '**/*.ogg', '**/*.spine-json', '**/*.skel', '**/*.import') }}
          restore-keys: godot-import-${{ env.MEGADOT_VERSION }}-

      - name: Download MegaDot
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: curl -L -o megadot.zip "https://megadot.megacrit.com/${MEGADOT_VERSION}/megadot-${MEGADOT_VERSION}-linux-x86_64-editor-csharp.zip"

      - name: Download spine-godot extension
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o spine-godot.zip \
            "https://spine-godot.s3.eu-central-1.amazonaws.com/4.2/4.5.1-stable/spine-godot-extension-${SPINE_VERSION}.zip"

      - name: Install engine
        run: |
          unzip -q megadot.zip -d megadot
          chmod +x megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64
          echo "GODOT_PATH=$(pwd)/megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          unzip -oq spine-godot.zip -d "${{ github.workspace }}"

      # Version source depends on trigger: manual run -> the input, tag push -> the tag (v1.2.3 -> 1.2.3)
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Patch the manifest's top-level "version" to match the tag (build-time only, not committed).
      # min_game_version and the BaseLib min_version stay as committed in the repo.
      - name: Sync manifest version
        run: |
          sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[0-9]+\.[0-9]+\.[0-9]+(")/\1'"$VERSION"'\2/' Downfall.json
          grep '"version"' Downfall.json

      - name: Build image atlases
        run: dotnet run --project ImageGen -c Release -- --repack

      - name: Import Godot resources
        run: |
          "$GODOT_PATH" --headless --audio-driver Dummy --import || true
          "$GODOT_PATH" --headless --audio-driver Dummy --import

      - name: Publish
        run: |
          mkdir -p "${{ github.workspace }}/output/mods"
          dotnet publish Downfall.csproj -c Release \
            /p:GodotPath="$GODOT_PATH" \
            /p:ModsPath="${{ github.workspace }}/output/mods/" \
            /p:SkipGodotImport=true \
            /p:Version="$VERSION" \
            /p:AssemblyVersion="$VERSION.0" \
            /p:FileVersion="$VERSION.0"

      # Zip ONLY the Downfall folder (BaseLib is a sibling in mods/ and is deliberately excluded),
      # without .pdb files — mirrors what release.ps1's staging did.
      - name: Package zip
        run: |
          test -d output/mods/Downfall || { echo "Built mod folder missing"; exit 1; }
          find output/mods/Downfall -name '*.pdb' -delete
          cd output/mods
          zip -r "../../Downfall-$VERSION.zip" Downfall
          cd ../..
          unzip -l "Downfall-$VERSION.zip"

      # Banner values come from the committed manifest instead of the local game install.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN_GAME=$(grep -oE '"min_game_version"[[:space:]]*:[[:space:]]*"[^"]+"' Downfall.json | sed -E 's/.*"([^"]+)"$/\1/' || true)
          BASELIB=$(grep -oE '<BaseLibVersion>[^<]+</BaseLibVersion>' build/mod.build.props | sed -E 's/<\/?BaseLibVersion>//g' || true)
          {
            echo "Works with Slay the Spire 2 version ${MIN_GAME:-unknown} or newer."
            echo "Requires BaseLib ${BASELIB:-unknown} (not included — install it separately)."
          } > banner.md
          TARGET=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="--target $GITHUB_SHA"
          fi
          gh release create "v$VERSION" "Downfall-$VERSION.zip" \
            $TARGET \
            --title "Downfall v$VERSION - StS2 v${MIN_GAME:-unknown}" \
            --generate-notes \
            --notes-file banner.md

      # ---- Steam Workshop upload (opt-in) ----
      # Requires: repo variable STEAM_WORKSHOP_ID (from mod_id.txt after the first
      # manual ModUploader upload), secrets STEAM_USERNAME and STEAM_CONFIG_VDF
      # (base64 of a locally logged-in steamcmd config/config.vdf).
      - name: Install SteamCMD
        if: vars.STEAM_WORKSHOP_ID != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1
          mkdir steamcmd && cd steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zx

      - name: Restore Steam session
        if: vars.STEAM_WORKSHOP_ID != ''
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          mkdir -p steamcmd/config
          echo "$STEAM_CONFIG_VDF" | base64 -d > steamcmd/config/config.vdf

      - name: Upload to Steam Workshop
        if: vars.STEAM_WORKSHOP_ID != ''
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          cat > item.vdf << VDF
          "workshopitem"
          {
              "appid"             "2868840"
              "publishedfileid"   "${{ vars.STEAM_WORKSHOP_ID }}"
              "contentfolder"     "$GITHUB_WORKSPACE/output/mods/Downfall"
              "changenote"        "Release v$VERSION - https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          }
          VDF
          ./steamcmd/steamcmd.sh +login "$STEAM_USERNAME" +workshop_build_item "$GITHUB_WORKSPACE/item.vdf" +quit